<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${installer.name} + ' — SolarCheck'">Installer — SolarCheck</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background: #f5f5f5; }
        a.back { color: #1a3a5c; text-decoration: none; font-size: 14px; }
        a.back:hover { text-decoration: underline; }
        .header { background: #fff; padding: 25px; border-radius: 8px; margin: 15px 0 25px 0; border-left: 4px solid #ddd; }
        .header.verified { border-left-color: #2e9e4f; }
        .header h1 { margin: 0 0 8px 0; color: #1a3a5c; }
        .badge { background: #2e9e4f; color: #fff; font-size: 13px; padding: 4px 10px; border-radius: 3px; margin-left: 10px; vertical-align: middle; }
        .meta { color: #666; font-size: 15px; margin: 4px 0; }
        .score { font-size: 28px; font-weight: bold; color: #f5a623; margin-top: 15px; }
        .score span.count { font-size: 14px; color: #888; font-weight: normal; }
        h2 { color: #1a3a5c; font-size: 20px; margin-top: 30px; }
        .review { background: #fff; padding: 18px; border-radius: 8px; margin-bottom: 12px; }
        .review .stars { color: #f5a623; font-weight: bold; }
        .review .author { color: #666; font-size: 14px; margin: 4px 0 10px 0; }
        .review h3 { margin: 6px 0; font-size: 17px; }
        .review p.body { margin: 0; line-height: 1.5; }
        .empty { background: #fff; padding: 30px; border-radius: 8px; text-align: center; color: #888; }
    </style>
</head>
<body>

<a class="back" href="/">&larr; Back to all installers</a>

<div class="header" th:classappend="${installer.verified} ? 'verified' : ''">
    <h1>
        <span th:text="${installer.name}">Company name</span>
        <span th:if="${installer.verified}" class="badge">VERIFIED</span>
    </h1>

    <p class="meta">
        <span th:text="${installer.city}">City</span>
        <span th:if="${installer.province}" th:text="', ' + ${installer.province}">, Province</span>
    </p>
    <p class="meta" th:if="${installer.phone}" th:text="${installer.phone}">Phone</p>
    <p class="meta" th:if="${installer.website}" th:text="${installer.website}">Website</p>

    <div class="score" th:if="${reviewCount > 0}">
        <span th:text="${average}">0.0</span> / 5
        <span class="count" th:text="'(' + ${reviewCount} + ' reviews)'">(0 reviews)</span>
    </div>
    <div class="score" th:if="${reviewCount == 0}">
        <span class="count">No reviews yet</span>
    </div>
</div>

<a th:href="@{/installer/{id}/review(id=${installer.id})}"
   style="display:inline-block; padding:12px 24px; background:#f5a623; color:#000;
          text-decoration:none; border-radius:4px; font-weight:bold;">
    Write a review
</a>

<h2>Reviews</h2>
<div th:if="${reviews.isEmpty()}" class="empty">
    <p>No published reviews for this installer yet.</p>
</div>

<div th:each="review : ${reviews}" class="review">
    <div class="stars">
        <span th:each="i : ${#numbers.sequence(1, 5)}"
              th:text="${i <= review.rating} ? '★' : '☆'">★</span>
    </div>    <h3 th:text="${review.title}">Review title</h3>
    <p class="author">
        by <span th:text="${review.authorName}">Author</span>
        on <span th:text="${#temporals.format(review.createdAt, 'd MMM yyyy')}">1 Jan 2026</span>
    </p>
    <p class="body" th:text="${review.body}">Review text</p>
</div>

</body>
</html>
