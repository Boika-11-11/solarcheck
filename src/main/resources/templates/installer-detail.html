<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
    <title>Installer — SolarCheck</title>
</head>
<body>

<div th:replace="~{layout :: header}"></div>

<div class="wrap">

    <a class="back" href="/">&larr; All installers</a>

    <div class="panel"
         th:style="${installer.verified} ? 'border-left:4px solid #2e9e4f' : 'border-left:4px solid #dde3ea'">

        <h1 style="margin-bottom:10px;">
            <span th:text="${installer.name}">Company name</span>
            <span th:if="${installer.verified}" class="badge">VERIFIED</span>
        </h1>

        <div class="rating" th:if="${reviewCount > 0}">
            <span class="stars">
                <span th:each="i : ${#numbers.sequence(1, 5)}"
                      th:text="${i <= average} ? '★' : '☆'">★</span>
            </span>
            <span class="value" style="font-size:20px;" th:text="${average}">0.0</span>
            <span class="count-txt"
                  th:text="${reviewCount == 1} ? '(1 review)' : '(' + ${reviewCount} + ' reviews)'">(0 reviews)</span>
        </div>
        <div class="rating" th:if="${reviewCount == 0}">
            <span class="none">No reviews yet — be the first</span>
        </div>

        <p class="meta">
            <span th:text="${installer.city}">City</span>
            <span th:if="${installer.province}" th:text="', ' + ${installer.province}">, Province</span>
        </p>
        <p class="meta" th:if="${installer.phone}" th:text="${installer.phone}">Phone</p>
        <p class="meta" th:if="${installer.website}" th:text="${installer.website}">Website</p>

        <div style="margin-top:18px;">
            <a th:href="@{/installer/{id}/review(id=${installer.id})}" class="btn">Write a review</a>
            <a href="/quotes" class="btn grey" style="margin-left:8px;">Get quotes</a>
        </div>
    </div>

    <h2 style="margin-top:34px;">Reviews</h2>

    <div th:if="${reviews.isEmpty()}" class="empty">
        <p>No published reviews for this installer yet.</p>
    </div>

    <div th:each="review : ${reviews}" class="panel">
        <div class="stars">
            <span th:each="i : ${#numbers.sequence(1, 5)}"
                  th:text="${i <= review.rating} ? '★' : '☆'">★</span>
        </div>
        <h2 style="margin:8px 0 4px 0; font-size:17px;" th:text="${review.title}">Title</h2>
        <p class="meta" style="margin-bottom:12px;">
            by <span th:text="${review.authorName}">Author</span>
            &middot; <span th:text="${#temporals.format(review.createdAt, 'd MMM yyyy')}">date</span>
        </p>
        <p style="margin:0;" th:text="${review.body}">Review text</p>
    </div>

</div>

<div th:replace="~{layout :: footer}"></div>

</body>
</html>
