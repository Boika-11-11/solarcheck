<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Request received — SolarCheck</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; background: #f5f5f5; }
        .box { background: #fff; padding: 40px; border-radius: 8px; text-align: center; margin-top: 40px; }
        h1 { color: #2e9e4f; font-size: 26px; margin-top: 0; }
        p { color: #555; line-height: 1.6; }
        a.button { display: inline-block; margin-top: 20px; padding: 12px 24px; background: #f5a623;
            color: #000; text-decoration: none; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

<div class="box">
    <h1>Request received</h1>
    <p>
        Thanks — we've got your details. We'll match you with up to 3 rated
        installers in your area and they'll be in touch directly.
    </p>
    <p>
        In the meantime, have a look at what other homeowners said about them.
    </p>
    <a class="button" href="/">Browse installers</a>
</div>

</body>
</html>
