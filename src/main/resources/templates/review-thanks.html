<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
    <title>Thank you — SolarCheck</title>
</head>
<body>

<div th:replace="~{layout :: header}"></div>

<div class="wrap narrow">
    <div class="panel" style="text-align:center; padding:44px;">
        <div style="font-size:40px; margin-bottom:8px;">✓</div>
        <h1 style="color:#2e9e4f;">Thank you</h1>
        <p class="sub" style="margin-bottom:8px;">
            Your review of <strong th:text="${installer.name}">Company</strong> has been submitted.
        </p>
        <p class="sub">
            It will be checked before it appears on the site. This usually takes a day or two.
        </p>
        <a class="btn" href="/">Back to all installers</a>
    </div>
</div>

</body>
</html>
