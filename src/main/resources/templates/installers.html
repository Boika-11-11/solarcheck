<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SolarCheck — Find a trusted solar installer</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background: #f5f5f5; }
        h1 { color: #1a3a5c; }
        .tagline { color: #666; margin-bottom: 30px; }
        .search { background: #fff; padding: 15px; border-radius: 8px; margin-bottom: 25px; }
        .search input { padding: 8px; width: 250px; border: 1px solid #ccc; border-radius: 4px; }
        .search button { padding: 8px 16px; background: #f5a623; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .card { background: #fff; padding: 18px; border-radius: 8px; margin-bottom: 12px; border-left: 4px solid #ddd; }
        .card.verified { border-left-color: #2e9e4f; }
        .card h2 { margin: 0 0 6px 0; font-size: 19px; }
        .badge { background: #2e9e4f; color: #fff; font-size: 12px; padding: 3px 8px; border-radius: 3px; margin-left: 8px; }
        .meta { color: #666; font-size: 14px; }
        .empty { background: #fff; padding: 30px; border-radius: 8px; text-align: center; color: #888; }
    </style>
</head>
<body>

<h1>SolarCheck</h1>
<p class="tagline">Find a trusted solar installer in South Africa.</p>

<div class="search">
    <form method="get" action="/">
        <input type="text" name="city" placeholder="Search by city..." th:value="${city}">
        <button type="submit">Search</button>
    </form>
</div>

<div th:if="${installers.isEmpty()}" class="empty">
    <p>No installers found yet.</p>
</div>

<div th:each="installer : ${installers}"
     class="card"
     th:classappend="${installer.verified} ? 'verified' : ''">

    <h2>
        <a th:href="@{/installer/{id}(id=${installer.id})}"
           th:text="${installer.name}"
           style="color:#1a3a5c; text-decoration:none;">Company name</a>
        <span th:if="${installer.verified}" class="badge">VERIFIED</span>
    </h2>

    <p class="meta">
        <span th:text="${installer.city}">City</span>
        <span th:if="${installer.province}" th:text="', ' + ${installer.province}">, Province</span>
    </p>

    <p class="meta" th:if="${installer.phone}" th:text="${installer.phone}">Phone</p>
    <p class="meta" th:if="${installer.website}" th:text="${installer.website}">Website</p>
</div>

</body>
</html>
