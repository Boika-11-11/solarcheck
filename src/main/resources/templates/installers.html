<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SolarCheck — Find a trusted solar installer</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background: #f5f5f5; }
        h1 { color: #1a3a5c; }
        .tagline { color: #666; margin-bottom: 30px; }
        .search { background: #fff; padding: 15px; border-radius: 8px; margin-bottom: 25px; }
        .search input { padding: 8px; width: 250px; border: 1px solid #ccc; border-radius: 4px; }
        .search button { padding: 8px 16px; background: #f5a623; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .card { background: #fff; padding: 18px; border-radius: 8px; margin-bottom: 12px; border-left: 4px solid #ddd; }
        .card.verified { border-left-color: #2e9e4f; }
        .card h2 { margin: 0 0 6px 0; font-size: 19px; }
        .badge { background: #2e9e4f; color: #fff; font-size: 12px; padding: 3px 8px; border-radius: 3px; margin-left: 8px; }
        .meta { color: #666; font-size: 14px; margin: 4px 0; }

        .rating { margin: 8px 0 10px 0; }
        .rating .stars { color: #f5a623; font-size: 16px; letter-spacing: 1px; }
        .rating .value { font-weight: bold; color: #1a3a5c; margin-left: 6px; font-size: 15px; }
        .rating .count { color: #888; font-size: 14px; margin-left: 4px; }
        .rating .none { color: #999; font-size: 14px; font-style: italic; }

        .empty { background: #fff; padding: 30px; border-radius: 8px; text-align: center; color: #888; }
    </style>
</head>
<body>

<h1>SolarCheck</h1>
<p class="tagline">Find a trusted solar installer in South Africa.</p>

<div class="search">
    <form method="get" action="/">
        <input type="text" name="city" placeholder="Search by city..." th:value="${city}">
        <button type="submit">Search</button>
    </form>
</div>

<div th:if="${cards.isEmpty()}" class="empty">
    <p>No installers found yet.</p>
</div>

<div th:each="card : ${cards}"
     class="card"
     th:classappend="${card.installer.verified} ? 'verified' : ''">

    <h2>
        <a th:href="@{/installer/{id}(id=${card.installer.id})}"
           th:text="${card.installer.name}"
           style="color:#1a3a5c; text-decoration:none;">Company name</a>
        <span th:if="${card.installer.verified}" class="badge">VERIFIED</span>
    </h2>

    <div class="rating">
        <span th:if="${card.hasReviews()}">
            <span class="stars">
                <span th:each="i : ${#numbers.sequence(1, 5)}"
                      th:text="${i <= card.average} ? '★' : '☆'">★</span>
            </span>
            <span class="value" th:text="${card.average}">0.0</span>
            <span class="count"
                  th:text="${card.reviewCount == 1} ? '(1 review)' : '(' + ${card.reviewCount} + ' reviews)'">(0 reviews)</span>
        </span>
        <span th:unless="${card.hasReviews()}" class="none">No reviews yet</span>
    </div>

    <p class="meta">
        <span th:text="${card.installer.city}">City</span>
        <span th:if="${card.installer.province}" th:text="', ' + ${card.installer.province}">, Province</span>
    </p>

    <p class="meta" th:if="${card.installer.phone}" th:text="${card.installer.phone}">Phone</p>
    <p class="meta" th:if="${card.installer.website}" th:text="${card.installer.website}">Website</p>
</div>

</body>
</html>
