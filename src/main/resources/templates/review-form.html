<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
    <title>Write a review — SolarCheck</title>
</head>
<body>

<div th:replace="~{layout :: header}"></div>

<div class="wrap narrow">

    <a class="back" th:href="@{/installer/{id}(id=${installer.id})}">&larr; Back</a>

    <h1>Write a review</h1>
    <p class="sub">for <strong th:text="${installer.name}">Company</strong></p>

    <div class="panel">

        <div th:if="${error}" class="error" th:text="${error}">Error</div>

        <form th:action="@{/installer/{id}/review(id=${installer.id})}" method="post">

            <div class="row">
                <div class="f">
                    <label for="authorName">Your name</label>
                    <input type="text" id="authorName" name="authorName" required>
                </div>
                <div class="f">
                    <label for="authorEmail">Your email (not shown publicly)</label>
                    <input type="email" id="authorEmail" name="authorEmail" required>
                </div>
            </div>

            <label for="rating">Rating</label>
            <select id="rating" name="rating" required>
                <option value="5">★★★★★ — Excellent</option>
                <option value="4">★★★★ — Good</option>
                <option value="3">★★★ — Okay</option>
                <option value="2">★★ — Poor</option>
                <option value="1">★ — Terrible</option>
            </select>

            <label for="title">Review title</label>
            <input type="text" id="title" name="title" maxlength="255"
                   placeholder="Sum it up in a few words" required>

            <label for="body">Your review</label>
            <textarea id="body" name="body" maxlength="2000"
                      placeholder="What was the quote process like? Did they finish on time? Did you get your CoC?" required></textarea>

            <div style="margin-top:20px;">
                <button type="submit" class="btn">Submit review</button>
            </div>

            <p class="note">
                Reviews are checked before they appear on the site.
                Only write about work you actually paid for.
            </p>
        </form>
    </div>

</div>

</body>
</html>
