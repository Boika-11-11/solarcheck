<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Write a review — SolarCheck</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; background: #f5f5f5; }
        a.back { color: #1a3a5c; text-decoration: none; font-size: 14px; }
        h1 { color: #1a3a5c; font-size: 24px; }
        .sub { color: #666; margin-bottom: 25px; }
        .form { background: #fff; padding: 25px; border-radius: 8px; }
        label { display: block; font-weight: bold; margin: 18px 0 6px 0; color: #333; font-size: 14px; }
        input[type=text], input[type=email], select, textarea {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;
            font-size: 15px; font-family: inherit; box-sizing: border-box;
        }
        textarea { min-height: 130px; resize: vertical; }
        button { margin-top: 22px; padding: 12px 26px; background: #f5a623; border: none;
            border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 15px; }
        .error { background: #fde8e8; color: #a12; padding: 12px; border-radius: 4px; margin-bottom: 15px; }
        .note { color: #888; font-size: 13px; margin-top: 15px; line-height: 1.5; }
    </style>
</head>
<body>

<a class="back" th:href="@{/installer/{id}(id=${installer.id})}">&larr; Back</a>

<h1>Write a review</h1>
<p class="sub">for <strong th:text="${installer.name}">Company</strong></p>

<div class="form">

    <div th:if="${error}" class="error" th:text="${error}">Error</div>

    <form th:action="@{/installer/{id}/review(id=${installer.id})}" method="post">

        <label for="authorName">Your name</label>
        <input type="text" id="authorName" name="authorName" required>

        <label for="authorEmail">Your email (not shown publicly)</label>
        <input type="email" id="authorEmail" name="authorEmail" required>

        <label for="rating">Rating</label>
        <select id="rating" name="rating" required>
            <option value="5">5 — Excellent</option>
            <option value="4">4 — Good</option>
            <option value="3">3 — Okay</option>
            <option value="2">2 — Poor</option>
            <option value="1">1 — Terrible</option>
        </select>

        <label for="title">Review title</label>
        <input type="text" id="title" name="title" maxlength="255" required>

        <label for="body">Your review</label>
        <textarea id="body" name="body" maxlength="2000" required></textarea>

        <button type="submit">Submit review</button>

        <p class="note">
            Reviews are checked before they appear on the site.
            Only write about work you actually paid for.
        </p>
    </form>
</div>

</body>
</html>
