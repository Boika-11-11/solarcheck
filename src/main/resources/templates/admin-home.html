<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin — SolarCheck</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 950px; margin: 0 auto; padding: 20px; background: #f5f5f5; }
        h1 { color: #1a3a5c; margin-bottom: 4px; }
        .sub { color: #666; margin-bottom: 26px; }
        .tiles { display: flex; gap: 14px; flex-wrap: wrap; }
        .tile { background: #fff; padding: 24px; border-radius: 8px; flex: 1; min-width: 210px;
            text-decoration: none; display: block; border-left: 4px solid #f5a623; }
        .tile.leads { border-left-color: #2e9e4f; }
        .tile h2 { margin: 0 0 6px 0; font-size: 17px; color: #1a3a5c; }
        .tile .num { font-size: 32px; font-weight: bold; color: #f5a623; }
        .tile.leads .num { color: #2e9e4f; }
        .tile .label { color: #888; font-size: 14px; }
        .links { margin-top: 30px; }
        .links a { color: #1a3a5c; font-size: 14px; }
    </style>
</head>
<body>

<h1>SolarCheck Admin</h1>
<p class="sub">Manage installers, moderate reviews, work your leads.</p>

<div class="tiles">
    <a class="tile leads" href="/admin/leads">
        <h2>New leads</h2>
        <div class="num" th:text="${newLeadCount}">0</div>
        <div class="label">quote requests to follow up</div>
    </a>

    <a class="tile" href="/admin/reviews">
        <h2>Pending reviews</h2>
        <div class="num" th:text="${pendingCount}">0</div>
        <div class="label">waiting for approval</div>
    </a>

    <a class="tile" href="/admin/installers">
        <h2>Installers</h2>
        <div class="num" th:text="${installerCount}">0</div>
        <div class="label">listed on the site</div>
    </a>
</div>

<div class="links">
    <a href="/">View public site</a>
</div>

</body>
</html>
